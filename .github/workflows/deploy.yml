name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}/benin-explo
            git fetch origin main
            git reset --hard origin/main
            cd ${{ secrets.VPS_PATH }}
            docker compose build benin-api
            docker compose up -d benin-api
            docker compose logs benin-api --tail=30
